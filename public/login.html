<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StaTech Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skipLink" href="#loginContainer">Skip to main content</a>

    <div id="sharedNavigation"></div>

    <div id="loginContainer" role="main" tabindex="-1">

        <div id="loginCard" class="authCard">

            <a class="authBrand" href="index.html" aria-label="StaTech home">
                <img src="statech-logo.svg" alt="">
                <span>StaTech</span>
            </a>

            <p class="authEyebrow">Welcome back</p>
            <h1>Login to StaTech</h1>

            <form id="loginForm" class="authForm">

                <div class="fieldGroup">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="fieldGroup">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button id="loginButton" class="authButton" type="submit">Login</button>
                <p id="loginStatus" class="authStatus" aria-live="polite"></p>
            </form>

            <p id="registerLink" class="authLink">
                Don’t have an account? <a href="register.html">Register here</a>
            </p>
            <p class="authLink">Teacher or mentor? <a href="mentor-register.html">Staff registration</a></p>

        </div>

    </div>

    <footer class="siteFooter authFooter">
        <div class="footerBrand">
            <img src="statech-logo.svg" alt="">
            <strong>StaTech</strong>
        </div>
        <p>Practical technology learning for curious girls.</p>
        <p>&copy; 2026 StaTech. All rights reserved.</p>
    </footer>

    <script src="navigation.js"></script>
    <script src="login.js"></script>

</body>
</html>
