<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StaTech Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skipLink" href="#registerContainer">Skip to main content</a>

    <div id="sharedNavigation"></div>

    <a class="authBrand registerBrand" href="index.html" aria-label="StaTech home">
        <img src="statech-logo.svg" alt="">
        <span>StaTech</span>
    </a>

    <div id="registerContainer" class="authLayout" role="main" tabindex="-1">
        <div class="authCard registerCard">
            <p class="authEyebrow">Create your account</p>
            <h1>Register for StaTech</h1>

            <form id="registerForm" class="authForm">
                <div class="fieldGroup">
                    <label for="registerName">Full name</label>
                    <input id="registerName" type="text" name="name" placeholder="Your full name" required>
                </div>

                <div class="fieldRow">
                    <div class="fieldGroup">
                        <label for="registerAge">Age</label>
                        <input id="registerAge" type="number" name="age" placeholder="Age" min="1" max="120" required>
                    </div>

                    <div class="fieldGroup">
                        <label for="registerGrade">Grade</label>
                        <input id="registerGrade" type="number" name="grade" placeholder="Grade" min="1" max="12" required>
                    </div>
                </div>

                <div class="fieldGroup">
                    <label for="registerGender">Gender</label>
                    <input id="registerGender" type="text" name="gender" placeholder="Gender" required>
                </div>

                <div class="fieldGroup">
                    <label for="registerSchool">School</label>
                    <input id="registerSchool" type="text" name="school" placeholder="Your school" required>
                </div>

                <div class="fieldGroup">
                    <label for="registerEmail">Email</label>
                    <input id="registerEmail" type="email" name="email" placeholder="Email address" required>
                </div>

                <div class="fieldGroup">
                    <label for="registerPassword">Password</label>
                    <input id="registerPassword" type="password" name="password" placeholder="Create a password" required>
                </div>

                <button class="authButton" type="submit">Register</button>
                <p id="registerStatus" class="authStatus" aria-live="polite"></p>
            </form>

            <p class="authLink">Already have an account? <a href="login.html">Login here</a></p>
            <p class="authLink">Teacher or mentor? <a href="mentor-register.html">Staff registration</a></p>
        </div>
    </div>

    <footer class="siteFooter authFooter">
        <div class="footerBrand">
            <img src="statech-logo.svg" alt="">
            <strong>StaTech</strong>
        </div>
        <p>Practical technology learning for curious girls.</p>
        <p>&copy; 2026 StaTech. All rights reserved.</p>
    </footer>

    <script src="navigation.js"></script>
    <script src="register.js"></script>

</body>
</html>
